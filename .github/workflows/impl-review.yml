# Agent code review on pull requests (10xChampion, M5L3), adapted from
# .claude/skills/10x-impl-review-ci/references/workflow-template.yml.
#
# Runs /10x-impl-review-ci through anthropics/claude-code-action on every same-repo PR:
# the skill finds the PR's context/changes/<id>/plan.md, reviews the diff against it, commits
# context/changes/<id>/reviews/impl-review.md back to the branch ([skip ci]), posts inline comments and a
# summary comment, and the last step turns the verdict into the "impl-review-ci/verdict" commit status.
# PRs without a plan get a neutral "no plan detected" comment.
#
# Secrets: ANTHROPIC_API_KEY (repo secret). GITHUB_TOKEN is the default workflow token.

name: Impl Review

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  impl-review:
    # Fork PRs can't receive commits-back or use repo secrets.
    if: github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: impl-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      # Toolchain for the plan's Automated Verification commands (dotnet build/test, ng test/build).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ClientApp/package-lock.json

      - name: Install SPA dependencies
        working-directory: ClientApp
        run: npm ci

      - name: Skip Claude run on bot commits and label-only events
        id: guard
        env:
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          AUTHOR=$(git log -1 --format='%an')
          SUBJECT=$(git log -1 --format='%s')
          PRIOR_CLAUDE=$(git log --author='claude\[bot\]' -1 --format='%H' 2>/dev/null || true)
          if [[ "$AUTHOR" == "claude[bot]" || "$SUBJECT" == *"[skip ci]"* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT_ACTION" == "labeled" || "$EVENT_ACTION" == "unlabeled" ]] && [[ -n "$PRIOR_CLAUDE" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage impl-review-ci skill (user-level)
        if: steps.guard.outputs.skip != 'true'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # claude-code-action treats the PR head's .claude/ as untrusted, so the skill is taken from the
          # BASE branch and staged into the user-level skills dir.
          git fetch origin "$BASE_REF" --depth=1 2>&1 | tail -1
          mkdir -p "$HOME/.claude/skills"
          git archive "origin/$BASE_REF" .claude/skills/10x-impl-review-ci \
            | tar -x --strip-components=2 -C "$HOME/.claude/skills/"

      - name: Run impl-review (CI)
        if: steps.guard.outputs.skip != 'true'
        uses: anthropics/claude-code-action@1d6de8cb0c237e7c15e9e1bdf973826ebae490cc # v1.0.248
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 60
            --allowedTools Read,Write,Glob,Grep,Bash,Agent,TaskCreate,TaskUpdate,TaskList,TaskGet,mcp__github_inline_comment__create_inline_comment
          prompt: |
            /10x-impl-review-ci

            You are running in CI (GitHub Actions) on a pull request.
            Execute the 10x-impl-review-ci skill to review this PR against
            its plan, commit the review report to the branch, and post a
            summary PR comment.

            Context:
              PR:       #${{ github.event.pull_request.number }}
              Base:     ${{ github.event.pull_request.base.ref }}
              Head:     ${{ github.event.pull_request.head.ref }}
              Run URL:  ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Project: ASP.NET Core 10 API (dotnet build movie-date.csproj; dotnet test tests/MovieDate.Tests —
            uses Testcontainers, Docker is available on the runner) + Angular SPA in ClientApp
            (npx ng test --watch=false; npm run build). Read CLAUDE.md and context/foundation/ for conventions.

            Plan discovery is automatic (PR diff + optional `Plan: ...`
            override in the PR body). If no plan is detected, post the
            neutral "no plan" comment and exit cleanly — do not fail
            the workflow.

      - name: Validate Claude's commit (skip-ci + output contract)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git fetch origin "$HEAD_REF" --depth=2 2>&1 | tail -1
          TIP=$(git rev-parse FETCH_HEAD)
          AUTHOR=$(git log -1 --format='%an' FETCH_HEAD)
          SUBJECT=$(git log -1 --format='%s' FETCH_HEAD)
          echo "Branch tip: sha=${TIP:0:10} author=\"$AUTHOR\" subject=\"$SUBJECT\""
          if [[ "$AUTHOR" != "claude[bot]" ]]; then
            echo "Tip is not a bot commit — nothing to validate."
            exit 0
          fi
          FAILED=0
          if [[ "$SUBJECT" != *"[skip ci]"* ]]; then
            echo "::error title=Missing [skip ci] marker::Bot commit \"$SUBJECT\" lacks [skip ci]."
            FAILED=1
          fi
          REVIEW_FILE=$(git show --name-only --format= FETCH_HEAD \
            | grep -E '(^|/)context/changes/[^/]+/reviews/impl-review.*\.md$' \
            | head -1)
          if [ -n "$REVIEW_FILE" ]; then
            FIRST_LINE=$(git show "FETCH_HEAD:$REVIEW_FILE" | head -1)
            if [[ "$FIRST_LINE" != "<!-- IMPL-REVIEW-REPORT -->" ]]; then
              echo "::error title=Skill output contract violated::Review file $REVIEW_FILE does not start with the <!-- IMPL-REVIEW-REPORT --> marker. First line was: \"$FIRST_LINE\"."
              FAILED=1
            fi
          else
            echo "::warning::Bot commit added no file matching context/changes/*/reviews/impl-review*.md."
          fi
          exit $FAILED

      - name: Check review verdict
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          STATUS_CONTEXT="impl-review-ci/verdict"
          post_status() {
            gh api --method POST "repos/{owner}/{repo}/statuses/${HEAD_SHA}" \
              -f state="$1" -f context="$STATUS_CONTEXT" -f description="$2" -f target_url="$RUN_URL" > /dev/null
          }
          REVIEW_FILE=$(find . -type f -path '*/context/changes/*/reviews/impl-review*.md' 2>/dev/null \
                          | xargs ls -t 2>/dev/null | head -1)
          if [ -z "$REVIEW_FILE" ] || [ ! -f "$REVIEW_FILE" ]; then
            echo "No review file on this branch — nothing to gate on. Passing."
            exit 0
          fi
          VERDICT=$(grep -m1 -E '^\- \*\*Verdict\*\*:' "$REVIEW_FILE" | grep -oE 'APPROVED|NEEDS ATTENTION|REJECTED' | head -1)
          echo "Review file: $REVIEW_FILE"
          echo "Verdict: ${VERDICT:-<unknown>}"
          case "$VERDICT" in
            APPROVED) post_status success "Verdict: APPROVED"; exit 0 ;;
            "NEEDS ATTENTION") post_status success "Verdict: NEEDS ATTENTION (reviewer triage recommended)"; exit 0 ;;
            REJECTED) ;;
            *) post_status success "Verdict unparseable; non-blocking (see logs)"; exit 0 ;;
          esac
          HAS_OVERRIDE=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[] | select(.name == "impl-review-override") | .name')
          if [ -n "$HAS_OVERRIDE" ]; then
            post_status success "REJECTED bypassed by 'impl-review-override' label"
            exit 0
          fi
          post_status failure "REJECTED — add 'impl-review-override' label to bypass"
          echo "::error title=Implementation review rejected::Verdict is REJECTED. Add the 'impl-review-override' label to bypass."
          exit 1
