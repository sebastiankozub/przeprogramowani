<section class="home">
  <p>Zalogowany jako <strong>{{ user()?.email }}</strong></p>
  @if (city(); as current) {
    <p>Twoje miasto: <strong>{{ cityLabel(current) }}</strong></p>
  } @else if (city() === null) {
    <a mat-stroked-button routerLink="/profile">Ustaw swoje miasto</a>
  }
  <a mat-flat-button routerLink="/movies">Obejrzane filmy</a>
  <a mat-flat-button routerLink="/watchlist">Do obejrzenia</a>
  @if (error(); as message) {
    <p class="auth-error" role="alert">{{ message }}</p>
  }
  <button mat-stroked-button type="button" (click)="logout()">Wyloguj się</button>
</section>
