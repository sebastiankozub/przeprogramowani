  @if (user()) {

      <a
        mat-button
        routerLink="/"
        routerLinkActive="app-nav-active"
        [routerLinkActiveOptions]="{ exact: true }"
        ariaCurrentWhenActive="page"
        >Start</a

      <a mat-button routerLink="/movies" routerLinkActive="app-nav-active" ariaCurrentWhenActive="page"

      >

      >
      <a mat-button routerLink="/matches" routerLinkActive="app-nav-active" ariaCurrentWhenActive="page"
        >Dopasowania</a
      >
      <a mat-button routerLink="/friends" routerLinkActive="app-nav-active" ariaCurrentWhenActive="page"

      >

      >
