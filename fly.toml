app = "moviedate-sk"             # "moviedate" was taken on Fly — see context/deployment/deploy-plan.md
primary_region = "fra"        # Frankfurt — "waw" is deprecated on Fly (confirmed at deploy time, not in docs); fra is the closest non-deprecated region to Poland (PRD: Poland-only MVP scope)

[build]

[deploy]
  # Runs once per deploy on a temporary machine, before web machines roll. A failed migration
  # (or a missing ConnectionStrings__Default secret) aborts the deploy and keeps the previous release.
  release_command = "dotnet movie-date.dll --migrate"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1    # avoid cold-start latency vs. PRD's <2s NFR; acceptable cost for a low-traffic MVP
  processes = ["web"]         # required once named [processes] exist — ties this service to the web group only.

  # Must stay DB-free: a DB-backed check every 30 s would keep Neon's free-tier compute awake.
  # Use /health/db on demand instead.
  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[processes]
  web = "dotnet movie-date.dll"
  # Match recompute runs in-process (hosted service) — no separate worker group; see tech-stack.md decisions.
